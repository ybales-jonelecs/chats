<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messenger - Upgraded</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="brand">Messenger</div>
      <p class="subtitle">Connect with your friends</p>

      <div class="auth-tabs">
        <button id="loginTab" class="active">Login</button>
        <button id="registerTab">Register</button>
      </div>

      <form id="authForm">
        <input id="nameInput" type="text" placeholder="Full name" class="hidden">
        <input id="emailInput" type="email" placeholder="Email" required>
        <input id="passwordInput" type="password" placeholder="Password" required>
        <button type="submit" class="primary-btn" id="authSubmit">Login</button>
      </form>
      <p id="authMessage" class="auth-message"></p>
    </div>
  </section>

  <section id="mainApp" class="main-app hidden">
    <aside class="sidebar">
      <div class="profile-header">
        <div class="profile-mini">
          <div id="myAvatar" class="avatar blue">U</div>
          <div>
            <strong id="myName">User</strong>
            <small><span class="online-dot"></span> Online</small>
          </div>
        </div>
        <button id="logoutBtn" class="small-btn">Logout</button>
      </div>

      <div class="search-box">
        <span>⌕</span>
        <input id="userSearch" type="text" placeholder="Search users">
      </div>

      <div class="section-title">Friends & Users</div>
      <div id="usersList" class="users-list"></div>
    </aside>

    <main class="chat-window">
      <header class="chat-header">
        <div id="emptyHeader" class="empty-chat-header">
          <h2>Select a user to start chatting</h2>
        </div>
        <div id="activeHeader" class="user-info hidden">
          <div id="chatAvatar" class="avatar blue">U</div>
          <div>
            <h2 id="chatName">User</h2>
            <span id="chatStatus">Offline</span>
          </div>
        </div>
        <div id="chatActions" class="header-actions hidden">
          <button class="icon-btn" title="Call">📞</button>
          <button class="icon-btn" title="Video">🎥</button>
          <button class="icon-btn" title="Profile">ⓘ</button>
        </div>
      </header>

      <section id="messages" class="messages">
        <div class="welcome">
          <div class="welcome-icon">💬</div>
          <h2>Welcome to Messenger</h2>
          <p>Choose a user from the left to start a conversation.</p>
        </div>
      </section>

      <form id="messageForm" class="message-form hidden">
        <input type="file" id="fileInput" hidden>
        <button type="button" id="attachBtn" class="attach-btn" title="Attach file">📎</button>
        <button type="button" id="imageBtn" class="attach-btn" title="Send image">🖼️</button>
        <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off">
        <button type="submit" class="send-btn">➤</button>
      </form>
    </main>

    <aside id="profilePanel" class="profile-panel hidden">
      <div class="panel-title">
        <h2>Profile</h2>
        <button id="closeProfile" class="icon-btn">×</button>
      </div>
      <div id="profileAvatar" class="avatar profile-avatar blue">U</div>
      <h2 id="profileName">User</h2>
      <p id="profileEmail">email@example.com</p>
      <p id="profileStatus" class="profile-status">● Online</p>
    </aside>
  </section>

</div>
<script type="module" src="app.js"></script>
</body>
</html>
