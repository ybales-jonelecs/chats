<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Messenger</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h1>Messenger</h1><p>Connect with your friends</p>
    <div class="tabs"><button id="loginTab" class="active">Login</button><button id="registerTab">Register</button></div>
    <form id="authForm">
      <input id="name" class="hidden" placeholder="Full name" autocomplete="name">
      <input id="email" type="email" placeholder="Email" required autocomplete="email">
      <input id="password" type="password" placeholder="Password" required autocomplete="current-password">
      <button class="primary" id="authButton">Login</button>
    </form>
    <div id="authError"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="me">
      <div id="myAvatar" class="avatar">U</div>
      <div><b id="myName">User</b><small><i></i> Online</small></div>
      <button id="logout">Logout</button>
    </div>
    <input id="search" class="search" placeholder="Search users">
    <h3>Users</h3>
    <div id="users"></div>
  </aside>

  <main class="chat">
    <header id="chatHeader"><span>Select a user to start chatting</span></header>
    <section id="messages" class="messages">
      <div class="empty"><strong>💬</strong><h2>Welcome to Messenger</h2><p>Select a user from the list.</p></div>
    </section>
    <form id="messageForm" class="composer hidden">
      <input type="file" id="fileInput" hidden>
      <button type="button" id="fileButton">📎</button>
      <button type="button" id="imageButton">🖼️</button>
      <input id="message" placeholder="Type a message..." autocomplete="off">
      <button class="send">➤</button>
    </form>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
