<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>Messenger</h1>
            <button id="newChatBtn" class="icon-btn">＋</button>
        </div>
        <div class="search-box">
            <span>⌕</span>
            <input type="text" id="searchInput" placeholder="Search Messenger">
        </div>
        <div class="chat-list" id="chatList">
            <div class="chat active" data-name="John">
                <div class="avatar blue">J</div>
                <div class="chat-info"><strong>John</strong><p>Hey! How are you?</p></div>
                <span class="time">10:30</span>
            </div>
            <div class="chat" data-name="Sarah">
                <div class="avatar pink">S</div>
                <div class="chat-info"><strong>Sarah</strong><p>See you tomorrow!</p></div>
                <span class="time">09:45</span>
            </div>
            <div class="chat" data-name="Mark">
                <div class="avatar green">M</div>
                <div class="chat-info"><strong>Mark</strong><p>Nice project!</p></div>
                <span class="time">Yesterday</span>
            </div>
        </div>
    </aside>

    <main class="chat-window">
        <header class="chat-header">
            <div class="user-info">
                <div class="avatar blue" id="headerAvatar">J</div>
                <div><h2 id="headerName">John</h2><span id="status">Active now</span></div>
            </div>
            <div class="header-actions">
                <button class="icon-btn">📞</button>
                <button class="icon-btn">🎥</button>
                <button class="icon-btn">ⓘ</button>
            </div>
        </header>

        <section class="messages" id="messages">
            <div class="message received">
                <div class="avatar blue small">J</div>
                <div class="message-content">
                    <span class="sender">John</span>
                    <div class="bubble">Hey! How are you?</div>
                    <span class="message-time">10:29 AM</span>
                </div>
            </div>
            <div class="message sent">
                <div class="message-content">
                    <div class="bubble">I'm good! How about you?</div>
                    <span class="message-time">10:30 AM</span>
                </div>
            </div>
            <div class="message received">
                <div class="avatar blue small">J</div>
                <div class="message-content">
                    <span class="sender">John</span>
                    <div class="bubble">I'm doing great! 👋</div>
                    <span class="message-time">10:30 AM</span>
                </div>
            </div>
        </section>

        <form class="message-form" id="messageForm">
            <button type="button" class="attach-btn" id="emojiBtn">😊</button>
            <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
            <button type="submit" class="send-btn">➤</button>
        </form>
    </main>
</div>

<div class="emoji-panel" id="emojiPanel">
    <button>😀</button><button>😂</button><button>😍</button><button>🥰</button>
    <button>😎</button><button>😭</button><button>😡</button><button>👍</button>
    <button>❤️</button><button>🔥</button><button>🎉</button><button>👋</button>
</div>

<script src="app.js"></script>
</body>
</html>
